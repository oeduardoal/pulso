<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulso: settings window</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
</style>
<style>html{background:#0b0f1a}body{display:flex;justify-content:center}body>div{flex:none}</style>
</head>
<body>
<div style="width: 900px; height: 640px; position: relative; overflow: hidden; background: linear-gradient(180deg, #071230 0%, #0f3566 34%, #2f6f9c 52%, #e9a06a 66%, #f7c88f 74%); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; color: rgba(255,255,255,0.96); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased">

<svg aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="xMaxYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%">
<path d="M0 640 C 220 560 420 680 720 610 S 1200 500 1440 560 V900 H0 Z" fill="#2b7391"></path>
<path d="M0 720 C 260 640 520 760 820 690 S 1260 600 1440 660 V900 H0 Z" fill="#1b5676"></path>
<path d="M0 800 C 300 730 600 840 900 770 S 1300 700 1440 750 V900 H0 Z" fill="#103a5a"></path>
<path d="M0 870 C 320 810 680 900 1000 840 S 1340 800 1440 830 V900 H0 Z" fill="#08233d"></path>
</svg>

<div style="position: absolute; left: 40px; top: 40px; width: 820px; height: 560px; display: flex; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 30px 80px rgba(0,0,0,0.5)">

<nav aria-label="Settings sections" style="width: 216px; flex: none; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; background: rgba(20,24,34,0.62); backdrop-filter: blur(48px) saturate(170%); -webkit-backdrop-filter: blur(48px) saturate(170%); border-right: 1px solid rgba(255,255,255,0.08); font-size: 13px">
<div aria-hidden="true" style="display: flex; gap: 8px; height: 30px; padding: 2px 6px">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span>
<span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span>
<span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span>
</div>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="width: 20px; height: 20px; border-radius: 6px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg></span>
<span>General</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="width: 20px; height: 20px; border-radius: 6px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 9.5h18"></path></svg></span>
<span>Menu Bar</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="width: 20px; height: 20px; border-radius: 6px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4"></path></svg></span>
<span>Alerts</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="width: 20px; height: 20px; border-radius: 6px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="16" height="7" rx="2"></rect></svg></span>
<span>Widgets</span>
</button>
<div style="padding: 14px 8px 4px; font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,0.7)">Modules</div>
<button type="button" aria-current="page" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: rgba(255,255,255,0.16); font-weight: 500; text-align: left">
<span style="width: 20px; height: 20px; border-radius: 6px; background: rgba(90,176,255,0.24); color: #8CC8FF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"></rect><path d="M9.5 3v3M14.5 3v3M9.5 18v3M14.5 18v3M3 9.5h3M3 14.5h3M18 9.5h3M18 14.5h3"></path></svg></span>
<span>CPU</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="width: 20px; height: 20px; border-radius: 6px; background: rgba(84,214,180,0.22); color: #7FE3C8; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="9" rx="2"></rect><path d="M7 16v3M12 16v3M17 16v3"></path></svg></span>
<span>Memory</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="width: 20px; height: 20px; border-radius: 6px; background: rgba(255,180,84,0.22); color: #FFC47A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="3"></rect><path d="M4 14h16"></path></svg></span>
<span>Disk</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="width: 20px; height: 20px; border-radius: 6px; background: rgba(90,176,255,0.24); color: #8CC8FF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19V6M4.5 9.5 8 6l3.5 3.5M16 5v13M12.5 14.5 16 18l3.5-3.5"></path></svg></span>
<span>Network</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="width: 20px; height: 20px; border-radius: 6px; background: rgba(107,219,122,0.22); color: #9BEBA6; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="16" height="8" rx="2.5"></rect><path d="M21.5 10.8v2.4"></path></svg></span>
<span>Battery</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="width: 20px; height: 20px; border-radius: 6px; background: rgba(255,122,107,0.22); color: #FFA397; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a2 2 0 0 0-2 2v8.3a3.5 3.5 0 1 0 4 0V6a2 2 0 0 0-2-2z"></path></svg></span>
<span>Sensors</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="width: 20px; height: 20px; border-radius: 6px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l10 8-5 4V4l5 4-10 8"></path></svg></span>
<span>Bluetooth</span>
</button>
</nav>

<main style="flex: 1; min-width: 0; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; background: rgba(24,27,36,0.93); backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px)">

<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: rgba(90,176,255,0.2); color: #8CC8FF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"></rect><path d="M9.5 3v3M14.5 3v3M9.5 18v3M14.5 18v3M3 9.5h3M3 14.5h3M18 9.5h3M18 14.5h3"></path></svg></span>
<div style="flex: 1; min-width: 0">
<h1 style="margin: 0; font-size: 17px; font-weight: 600">CPU</h1>
<div style="font-size: 12px; color: rgba(255,255,255,0.7)">Usage, temperature and processes</div>
</div>
<span style="font-size: 13px; color: rgba(255,255,255,0.7)">Module enabled</span>
<button type="button" role="switch" aria-checked="true" aria-label="Module enabled" style="width: 38px; height: 22px; flex: none; padding: 2px; border: 0; border-radius: 11px; background: #30B95A; display: flex; justify-content: flex-end"><span style="width: 18px; height: 18px; border-radius: 9px; background: #ffffff"></span></button>
</div>

<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; padding-left: 4px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7)">In the menu bar</h2>
<div style="border-radius: 12px; background: rgba(255,255,255,0.06); font-size: 13px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 88px; padding: 0 14px">
<span>Style</span>
<div style="display: flex; gap: 8px">
<button type="button" style="width: 78px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid transparent; border-radius: 10px; background: rgba(255,255,255,0.06); font-size: 11.5px; color: rgba(255,255,255,0.78)">
<span style="height: 18px; display: flex; align-items: center; font-size: 13px; font-weight: 600; color: #ffffff">18%</span>
<span>Mini</span>
</button>
<button type="button" style="width: 78px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid transparent; border-radius: 10px; background: rgba(255,255,255,0.06); font-size: 11.5px; color: rgba(255,255,255,0.78)">
<svg aria-hidden="true" width="36" height="18" viewBox="0 0 36 18" fill="none"><path d="M1 13 L6 11 L11 14 L16 8 L21 10 L26 4 L31 9 L35 6" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span>Line</span>
</button>
<button type="button" aria-pressed="true" style="width: 78px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid #5AB0FF; border-radius: 10px; background: rgba(90,176,255,0.16); font-size: 11.5px; color: #ffffff">
<svg aria-hidden="true" width="30" height="18" viewBox="0 0 22 14" fill="#ffffff"><rect x="0" y="9" width="2.6" height="5" rx="1"></rect><rect x="3.9" y="6" width="2.6" height="8" rx="1"></rect><rect x="7.8" y="8" width="2.6" height="6" rx="1"></rect><rect x="11.7" y="3" width="2.6" height="11" rx="1"></rect><rect x="15.6" y="7" width="2.6" height="7" rx="1"></rect><rect x="19.4" y="5" width="2.6" height="9" rx="1"></rect></svg>
<span>Bars</span>
</button>
<button type="button" style="width: 78px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid transparent; border-radius: 10px; background: rgba(255,255,255,0.06); font-size: 11.5px; color: rgba(255,255,255,0.78)">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.2" stroke="rgba(255,255,255,0.3)" stroke-width="3"></circle><circle cx="7" cy="7" r="5.2" stroke="#ffffff" stroke-width="3" stroke-dasharray="5.9 32.7" transform="rotate(-90 7 7)"></circle></svg>
<span>Ring</span>
</button>
<button type="button" style="width: 78px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid transparent; border-radius: 10px; background: rgba(255,255,255,0.06); font-size: 11.5px; color: rgba(255,255,255,0.78)">
<span style="height: 18px; display: flex; align-items: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: #6BDB7A"></span></span>
<span>Dot</span>
</button>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px; border-top: 1px solid rgba(255,255,255,0.08)">
<span>Color</span>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="Blue" aria-pressed="true" style="width: 18px; height: 18px; padding: 0; border: 0; border-radius: 9px; background: #5AB0FF; box-shadow: 0 0 0 2px #23262f, 0 0 0 3.5px #5AB0FF"></button>
<button type="button" aria-label="Teal" style="width: 18px; height: 18px; padding: 0; border: 0; border-radius: 9px; background: #54D6B4"></button>
<button type="button" aria-label="Amber" style="width: 18px; height: 18px; padding: 0; border: 0; border-radius: 9px; background: #FFB454"></button>
<button type="button" aria-label="Coral" style="width: 18px; height: 18px; padding: 0; border: 0; border-radius: 9px; background: #FF7A6B"></button>
<button type="button" aria-label="Monochrome" style="width: 18px; height: 18px; padding: 0; border: 0; border-radius: 9px; background: #ffffff"></button>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px; border-top: 1px solid rgba(255,255,255,0.08)">
<span>Update every</span>
<button type="button" style="height: 26px; padding: 0 8px 0 10px; border: 0; border-radius: 7px; background: rgba(255,255,255,0.12); display: flex; align-items: center; gap: 6px">
<span>1 second</span>
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9.5 12 5.5l4 4M8 14.5l4 4 4-4"></path></svg>
</button>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; padding-left: 4px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7)">In the panel</h2>
<div style="border-radius: 12px; background: rgba(255,255,255,0.06); font-size: 13px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px">
<span>Per-core usage</span>
<button type="button" role="switch" aria-checked="true" aria-label="Per-core usage" style="width: 38px; height: 22px; padding: 2px; border: 0; border-radius: 11px; background: #30B95A; display: flex; justify-content: flex-end"><span style="width: 18px; height: 18px; border-radius: 9px; background: #ffffff"></span></button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px; border-top: 1px solid rgba(255,255,255,0.08)">
<span>Temperature</span>
<button type="button" role="switch" aria-checked="true" aria-label="Temperature" style="width: 38px; height: 22px; padding: 2px; border: 0; border-radius: 11px; background: #30B95A; display: flex; justify-content: flex-end"><span style="width: 18px; height: 18px; border-radius: 9px; background: #ffffff"></span></button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px; border-top: 1px solid rgba(255,255,255,0.08)">
<span>Processes shown</span>
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-weight: 600">5</span>
<div style="display: flex; height: 26px; border-radius: 7px; overflow: hidden; background: rgba(255,255,255,0.12)">
<button type="button" aria-label="Decrease" style="width: 28px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
<button type="button" aria-label="Increase" style="width: 28px; padding: 0; border: 0; border-left: 1px solid rgba(255,255,255,0.12); background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12M12 6v12"></path></svg></button>
</div>
</div>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; padding-left: 4px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7)">Alerts</h2>
<div style="border-radius: 12px; background: rgba(255,255,255,0.06); font-size: 13px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px">
<span>Notify when usage stays above 90% for 30 seconds</span>
<button type="button" role="switch" aria-checked="true" aria-label="Notify when usage stays above 90% for 30 seconds" style="width: 38px; height: 22px; padding: 2px; border: 0; border-radius: 11px; background: #30B95A; display: flex; justify-content: flex-end"><span style="width: 18px; height: 18px; border-radius: 9px; background: #ffffff"></span></button>
</div>
</div>
</section>

</main>
</div>

</div>
</body>
</html>
