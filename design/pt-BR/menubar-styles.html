<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulso: estilos de widget na barra de menus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
</style>
<style>html{background:#0b0f1a}body{display:flex;justify-content:center}body>div{flex:none}</style>
</head>
<body>
<div style="width: 900px; height: 140px; display: flex; align-items: center; justify-content: center; gap: 36px; background: linear-gradient(180deg, #081638 0%, #0f3566 100%); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.96); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased">

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.12)">
<span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.78)">CPU</span>
<span>18%</span>
</div>
<div style="font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.78)">Mini</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.12)">
<svg aria-hidden="true" width="40" height="16" viewBox="0 0 40 16" fill="none"><path d="M1 12 L6 10 L11 13 L16 7 L21 9 L26 3 L31 8 L35 5 L39 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span>18%</span>
</div>
<div style="font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.78)">Linha</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.12)">
<svg aria-hidden="true" width="22" height="14" viewBox="0 0 22 14" fill="currentColor"><rect x="0" y="9" width="2.6" height="5" rx="1"></rect><rect x="3.9" y="6" width="2.6" height="8" rx="1"></rect><rect x="7.8" y="8" width="2.6" height="6" rx="1"></rect><rect x="11.7" y="3" width="2.6" height="11" rx="1"></rect><rect x="15.6" y="7" width="2.6" height="7" rx="1"></rect><rect x="19.4" y="5" width="2.6" height="9" rx="1"></rect></svg>
<span>18%</span>
</div>
<div style="font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.78)">Barras</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.12)">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.2" stroke="rgba(255,255,255,0.35)" stroke-width="3"></circle><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="3" stroke-dasharray="20.3 32.7" transform="rotate(-90 7 7)"></circle></svg>
<span>62%</span>
</div>
<div style="font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.78)">Anel</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: 8px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.12)">
<span style="display: flex; align-items: center; gap: 3px"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>2,4 MB/s</span>
<span style="display: flex; align-items: center; gap: 3px"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>310 KB/s</span>
</div>
<div style="font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.78)">Velocidade</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.12)">
<svg aria-hidden="true" width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.75" y="0.75" width="21.5" height="11.5" rx="3.5" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"></rect><rect x="2.5" y="2.5" width="14" height="8" rx="2" fill="currentColor"></rect><path d="M25 4.5v4" stroke="rgba(255,255,255,0.6)" stroke-width="1.6" stroke-linecap="round"></path></svg>
<span>78%</span>
</div>
<div style="font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.78)">Bateria</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.12)">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #6BDB7A"></span>
<span>54°</span>
</div>
<div style="font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.78)">Ponto</div>
</div>

</div>
</body>
</html>
