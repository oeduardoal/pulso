name: Release

# Pushing a tag like v0.1.0 builds a Developer ID signed, notarized DMG and publishes it as a
# GitHub release with the matching CHANGELOG section as notes. See docs/RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, like v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    # Apple sometimes takes over an hour to notarize, especially for a new certificate.
    timeout-minutes: 240
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for name in P12 P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release secrets:$missing. See docs/RELEASING.md."
            exit 1
          fi

      - name: Resolve version
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/make-dmg.sh "$VERSION"

      - name: Release notes
        run: |
          REPO_RAW="https://raw.githubusercontent.com/${{ github.repository }}/$TAG"
          SHA="$(cut -d' ' -f1 "build/Pulso-$VERSION.dmg.sha256")"
          {
            echo "<p align=\"center\"><img src=\"$REPO_RAW/docs/images/overview.png\" width=\"300\" alt=\"Pulso overview panel\"></p>"
            echo
            echo "A menu bar system monitor for macOS: CPU, memory, disk, network, battery and sensors in a native glass panel, with desktop widgets and alerts. English and Portuguese (Brazil)."
            echo
            echo "## Download"
            echo
            echo "**[Pulso-$VERSION.dmg](https://github.com/${{ github.repository }}/releases/download/$TAG/Pulso-$VERSION.dmg)**: open it, drag Pulso to Applications, then open Pulso from Applications. It lives in the menu bar."
            echo
            echo "Requires macOS 26 or later. Signed with Developer ID and notarized by Apple."
            echo
            echo "## What's new"
            awk -v version="$VERSION" '
              $0 ~ "^## \\[" version "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[.*\]: / { next }
              found { sub(/^### /, "#### "); print }
            ' CHANGELOG.md
            echo
            echo "<sub>SHA-256 of the DMG: <code>$SHA</code></sub>"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" "build/Pulso-$VERSION.dmg" "build/Pulso-$VERSION.dmg.sha256" \
            --title "Pulso $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $prerelease

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
